# Week 7's NodePort Service, on the same port 30080.
apiVersion: v1
kind: Service
metadata:
  name: davine-webapp-service
  namespace: davine-space
  labels:
    app.kubernetes.io/name: davine-webapp
spec:
  type: NodePort
  selector:
    app: davine-webapp
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
