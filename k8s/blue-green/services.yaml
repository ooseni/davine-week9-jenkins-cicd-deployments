# live:    what users reach, on NodePort 30081. Its selector names one slot.
# preview: the idle slot, on NodePort 30082, so a release is tested before anyone sees it.
# scripts/blue_green.sh flips both selectors at the switch.
apiVersion: v1
kind: Service
metadata:
  name: davine-webapp-bg-live
  namespace: davine-space
  labels:
    app.kubernetes.io/name: davine-webapp-bg
spec:
  type: NodePort
  selector:
    app: davine-webapp-bg
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: davine-webapp-bg-preview
  namespace: davine-space
  labels:
    app.kubernetes.io/name: davine-webapp-bg
spec:
  type: NodePort
  selector:
    app: davine-webapp-bg
    slot: green
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
