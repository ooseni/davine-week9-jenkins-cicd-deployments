# An empty placeholder for the registry pull secret the pods name. The admin creates it, so the
# deployer only needs to update this one secret by name: it cannot create secrets or read any
# other. The pipeline fills it with its 12-hour ECR token at each deploy.
apiVersion: v1
kind: Secret
metadata:
  name: ecr-pull
  namespace: davine-space
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{}}'
